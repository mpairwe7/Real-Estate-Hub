name: Automatic Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Get version from tag
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            # First release
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            # Generate changelog between tags
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          
          # Save to file for multiline output
          echo "$CHANGELOG" > changelog.txt
          
          # Also save commit count
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count ${PREVIOUS_TAG}..HEAD)
          fi
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_OUTPUT
      
      - name: Create Release Notes
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          COMMIT_COUNT="${{ steps.changelog.outputs.COMMIT_COUNT }}"
          CHANGELOG=$(cat changelog.txt)
          
          cat << EOF > release_notes.md
          # Release v${VERSION}
          
          **Release Date:** $(date '+%Y-%m-%d')
          **Commits:** ${COMMIT_COUNT} commits since last release
          
          ## What's Changed
          
          ${CHANGELOG}
          
          ## Installation
          
          \`\`\`bash
          # Clone the repository
          git clone https://github.com/${{ github.repository }}.git
          cd Real-Estate-Hub
          
          # Checkout this version
          git checkout v${VERSION}
          
          # Install dependencies
          yarn install
          
          # Run the application
          yarn dev
          \`\`\`
          
          ## Docker (Grafana Monitoring)
          
          \`\`\`bash
          # Start Grafana monitoring
          podman-compose -f docker-compose.monitoring.yml up -d
          
          # Access Grafana
          # URL: http://localhost:3001
          # Username: admin
          # Password: admin123
          \`\`\`
          
          ## Deployment
          
          \`\`\`bash
          # Deploy to Vercel
          vercel --prod
          \`\`\`
          
          ## Documentation
          
          - [Week 4 README](./WEEK4-README.md) - Production Refinement
          - [Week 5 README](./WEEK5-README.md) - Final Validation
          - [Grafana Setup](./docs/GRAFANA-MONITORING-SETUP.md)
          - [CI/CD Pipeline](./docs/CI-CD-PIPELINE-REPORT.md)
          
          ## Full Changelog
          
          **Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "initial")...v${VERSION}
          EOF
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Post-release notification
        run: |
          echo "✅ Release v${{ steps.get_version.outputs.VERSION }} created successfully!"
          echo "📦 View release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.TAG }}"

  deploy-to-vercel:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          github-comment: false
