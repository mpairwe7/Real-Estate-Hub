# Grafana Datasource Configuration
# Configure JSON API datasource for Next.js metrics

apiVersion: 1

datasources:
  # JSON API Datasource - Local Next.js application
  - name: Real Estate Hub (Local)
    type: simplejson
    access: proxy
    url: http://host.containers.internal:3000/api/grafana
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      keepCookies: []
      timeout: 60
    version: 1
  
  # JSON API Datasource - Production deployment
  - name: Real Estate Hub (Production)
    type: simplejson
    access: proxy
    url: https://real-estate-nwp6a86sm-mpairwe-laubens-projects.vercel.app/api/grafana
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      keepCookies: []
      timeout: 60
    version: 1
    
  # TestData DB for demo and testing
  - name: TestData DB
    type: testdata
    access: proxy
    editable: true
    version: 1
