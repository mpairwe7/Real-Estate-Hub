# Prometheus Configuration for Real Estate Hub
# This file configures Prometheus to scrape metrics from your Next.js application

global:
  scrape_interval: 15s # Scrape metrics every 15 seconds
  evaluation_interval: 15s # Evaluate rules every 15 seconds
  external_labels:
    monitor: 'real-estate-hub-monitor'
    environment: 'production'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Real Estate Hub Next.js Application
  - job_name: 'real-estate-hub'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/api/metrics'
    scheme: 'https'
    static_configs:
      - targets:
          - 'real-estate-hub.vercel.app' # Replace with your actual Vercel domain
        labels:
          application: 'real-estate-hub'
          environment: 'production'

  # Node.js Application Metrics
  - job_name: 'nodejs-app'
    scrape_interval: 15s
    metrics_path: '/api/metrics'
    scheme: 'https'
    static_configs:
      - targets:
          - 'real-estate-hub.vercel.app'
        labels:
          service: 'nextjs-server'
          
  # Supabase Database Metrics (if exposing metrics)
  # - job_name: 'supabase-db'
  #   scrape_interval: 30s
  #   static_configs:
  #     - targets:
  #         - 'your-supabase-instance:9187' # PostgreSQL exporter
  #       labels:
  #         service: 'postgresql'

# Storage configuration
storage:
  tsdb:
    path: /prometheus/data
    retention:
      time: 15d # Keep data for 15 days
      size: 5GB # Maximum storage size
